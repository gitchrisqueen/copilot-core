name: Bug report
description: Something in copilot-core is broken
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: node-python
    attributes:
      label: Node / Python versions
      placeholder: "node -v / python3 --version"
  - type: input
    id: core-version
    attributes:
      label: copilot-core version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant console/server logs (redact anything private)
