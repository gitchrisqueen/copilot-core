name: ci
on:
  push:
    branches: [main]
  pull_request: {}
  workflow_call: {}   # lets release.yml invoke this as a reusable workflow before publishing

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm run check
      - run: npm ci
      - run: npx c8 -r lcov -r text node --test test/js/**/*.test.js
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: js
          token: ${{ secrets.CODECOV_TOKEN }}

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11"]' || '["3.11","3.13"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest --cov=copilot_core --cov-report=xml test/python/
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck any *.command scripts
        run: |
          shopt -s nullglob
          files=(*.command)
          if [ ${#files[@]} -gt 0 ]; then
            for f in "${files[@]}"; do bash -n "$f"; done
            shellcheck -S warning "${files[@]}"
          else
            echo "no .command scripts in this repo"
          fi
